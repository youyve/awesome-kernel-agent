<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="774" viewBox="0 0 1200 774" role="img" aria-labelledby="title desc">
  <title id="title">Kernel Agent Evidence Field Map</title>
  <desc id="desc">A complete nine-dimension presentation projection over all 127 Agent systems. It selects no facets or representative systems.</desc>
  <style>
    text { font-family: system-ui, -apple-system, 'Segoe UI', sans-serif; }
    .title { fill: #0f172a; font-size: 26px; font-weight: 700; }
    .subtitle { fill: #475569; font-size: 15px; }
    .group-title { fill: #0f172a; font-size: 18px; font-weight: 700; }
    .label { fill: #0f172a; font-size: 15px; font-weight: 650; }
    .body { fill: #475569; font-size: 14px; }
    .small { fill: #475569; font-size: 12px; }
  </style>
  <rect width="1200" height="774" rx="14" fill="#f8fafc"/>
  <text x="36" y="46" class="title">Field Map: nine-dimension evidence projection</text>
  <text x="36" y="74" class="subtitle">
    <tspan x="36" dy="0">Question: along which major dimensions can Kernel Agent systems be understood and compared, and where does the catalog contain positive</tspan>
    <tspan x="36" dy="19">evidence?</tspan>
  </text>
  <text x="36" y="115" class="small">
    <tspan x="36" dy="0">All 127 Agent entries are the denominator. Each card is a union of explicitly mapped detailed facets; multi-label counts are inclusive and empty means unannotated, not absent.</tspan>
  </text>
  <g id="field-map-adaptation" data-role="presentation-dimension">
    <rect x="36" y="139" width="366" height="185" rx="12" fill="#ffffff" stroke="#60a5fa"/>
    <rect x="36" y="139" width="6" height="185" rx="3" fill="#2563eb"/>
    <text x="54" y="166" class="group-title">
      <tspan x="54" dy="0">Adaptation</tspan>
    </text>
    <text x="54" y="189" class="body">
      <tspan x="54" dy="0">How is the proposal policy adapted?</tspan>
    </text>
    <text x="54" y="215" class="small">
      <tspan x="54" dy="0">Policy adaptation: 44/127 tagged</tspan>
    </text>
    <rect x="54" y="238" width="330" height="12" rx="4" fill="#dbeafe"/>
    <rect x="54" y="238" width="114" height="12" rx="4" fill="#2563eb"/>
    <text x="54" y="270" class="small">Union evidence 44/127 · used values 6/9</text>
  </g>
  <g id="field-map-search" data-role="presentation-dimension">
    <rect x="416" y="139" width="366" height="185" rx="12" fill="#ffffff" stroke="#60a5fa"/>
    <rect x="416" y="139" width="6" height="185" rx="3" fill="#2563eb"/>
    <text x="434" y="166" class="group-title">
      <tspan x="434" dy="0">Search</tspan>
    </text>
    <text x="434" y="189" class="body">
      <tspan x="434" dy="0">How are candidates produced, revised,</tspan>
      <tspan x="434" dy="18">explored, or selected?</tspan>
    </text>
    <text x="434" y="233" class="small">
      <tspan x="434" dy="0">Generation mode: 54/127 tagged</tspan>
    </text>
    <text x="434" y="252" class="small">
      <tspan x="434" dy="0">Search strategy: 23/127 tagged</tspan>
    </text>
    <rect x="434" y="275" width="330" height="12" rx="4" fill="#dbeafe"/>
    <rect x="434" y="275" width="182" height="12" rx="4" fill="#2563eb"/>
    <text x="434" y="307" class="small">Union evidence 70/127 · used values 11/11</text>
  </g>
  <g id="field-map-orchestration" data-role="presentation-dimension">
    <rect x="796" y="139" width="366" height="185" rx="12" fill="#ffffff" stroke="#60a5fa"/>
    <rect x="796" y="139" width="6" height="185" rx="3" fill="#2563eb"/>
    <text x="814" y="166" class="group-title">
      <tspan x="814" dy="0">Orchestration</tspan>
    </text>
    <text x="814" y="189" class="body">
      <tspan x="814" dy="0">Which actors participate and how are they</tspan>
      <tspan x="814" dy="18">coordinated?</tspan>
    </text>
    <text x="814" y="233" class="small">
      <tspan x="814" dy="0">Actor composition: 35/127 tagged</tspan>
    </text>
    <text x="814" y="252" class="small">
      <tspan x="814" dy="0">Coordination: 25/127 tagged</tspan>
    </text>
    <rect x="814" y="275" width="330" height="12" rx="4" fill="#dbeafe"/>
    <rect x="814" y="275" width="109" height="12" rx="4" fill="#2563eb"/>
    <text x="814" y="307" class="small">Union evidence 42/127 · used values 8/8</text>
  </g>
  <g id="field-map-feedback" data-role="presentation-dimension">
    <rect x="36" y="338" width="366" height="185" rx="12" fill="#ffffff" stroke="#60a5fa"/>
    <rect x="36" y="338" width="6" height="185" rx="3" fill="#2563eb"/>
    <text x="54" y="365" class="group-title">
      <tspan x="54" dy="0">Feedback</tspan>
    </text>
    <text x="54" y="388" class="body">
      <tspan x="54" dy="0">What outcome is observed, and through which</tspan>
      <tspan x="54" dy="18">evidence channel?</tspan>
    </text>
    <text x="54" y="432" class="small">
      <tspan x="54" dy="0">Feedback signal: 73/127 tagged</tspan>
    </text>
    <text x="54" y="451" class="small">
      <tspan x="54" dy="0">Feedback source: 52/127 tagged</tspan>
    </text>
    <rect x="54" y="474" width="330" height="12" rx="4" fill="#dbeafe"/>
    <rect x="54" y="474" width="226" height="12" rx="4" fill="#2563eb"/>
    <text x="54" y="506" class="small">Union evidence 87/127 · used values 11/11</text>
  </g>
  <g id="field-map-memory" data-role="presentation-dimension">
    <rect x="416" y="338" width="366" height="185" rx="12" fill="#ffffff" stroke="#60a5fa"/>
    <rect x="416" y="338" width="6" height="185" rx="3" fill="#2563eb"/>
    <text x="434" y="365" class="group-title">
      <tspan x="434" dy="0">Memory</tspan>
    </text>
    <text x="434" y="388" class="body">
      <tspan x="434" dy="0">Which optimization state is retained or</tspan>
      <tspan x="434" dy="18">reused?</tspan>
    </text>
    <text x="434" y="432" class="small">
      <tspan x="434" dy="0">State retention: 36/127 tagged</tspan>
    </text>
    <rect x="434" y="455" width="330" height="12" rx="4" fill="#dbeafe"/>
    <rect x="434" y="455" width="94" height="12" rx="4" fill="#2563eb"/>
    <text x="434" y="487" class="small">Union evidence 36/127 · used values 7/8</text>
  </g>
  <g id="field-map-scope" data-role="presentation-dimension">
    <rect x="796" y="338" width="366" height="185" rx="12" fill="#ffffff" stroke="#60a5fa"/>
    <rect x="796" y="338" width="6" height="185" rx="3" fill="#2563eb"/>
    <text x="814" y="365" class="group-title">
      <tspan x="814" dy="0">Scope</tspan>
    </text>
    <text x="814" y="388" class="body">
      <tspan x="814" dy="0">What workload extent and integration</tspan>
      <tspan x="814" dy="18">context are in scope?</tspan>
    </text>
    <text x="814" y="432" class="small">
      <tspan x="814" dy="0">Workload scope: 72/127 tagged</tspan>
    </text>
    <text x="814" y="451" class="small">
      <tspan x="814" dy="0">Integration scope: 25/127 tagged</tspan>
    </text>
    <rect x="814" y="474" width="330" height="12" rx="4" fill="#dbeafe"/>
    <rect x="814" y="474" width="208" height="12" rx="4" fill="#2563eb"/>
    <text x="814" y="506" class="small">Union evidence 80/127 · used values 11/11</text>
  </g>
  <g id="field-map-optimization-target" data-role="presentation-dimension">
    <rect x="36" y="537" width="366" height="185" rx="12" fill="#ffffff" stroke="#60a5fa"/>
    <rect x="36" y="537" width="6" height="185" rx="3" fill="#2563eb"/>
    <text x="54" y="564" class="group-title">
      <tspan x="54" dy="0">Optimization target</tspan>
    </text>
    <text x="54" y="587" class="body">
      <tspan x="54" dy="0">At what artifact level, and over which</tspan>
      <tspan x="54" dy="18">decision type, does optimization act?</tspan>
    </text>
    <text x="54" y="631" class="small">
      <tspan x="54" dy="0">Artifact level: 126/127 tagged</tspan>
    </text>
    <text x="54" y="650" class="small">
      <tspan x="54" dy="0">Optimization focus: 12/127 tagged</tspan>
    </text>
    <rect x="54" y="673" width="330" height="12" rx="4" fill="#dbeafe"/>
    <rect x="54" y="673" width="327" height="12" rx="4" fill="#2563eb"/>
    <text x="54" y="705" class="small">Union evidence 126/127 · used values 8/9</text>
  </g>
  <g id="field-map-representation" data-role="presentation-dimension">
    <rect x="416" y="537" width="366" height="185" rx="12" fill="#ffffff" stroke="#60a5fa"/>
    <rect x="416" y="537" width="6" height="185" rx="3" fill="#2563eb"/>
    <text x="434" y="564" class="group-title">
      <tspan x="434" dy="0">Representation</tspan>
    </text>
    <text x="434" y="587" class="body">
      <tspan x="434" dy="0">Which concrete language, DSL, IR, or ISA</tspan>
      <tspan x="434" dy="18">carries the artifact?</tspan>
    </text>
    <text x="434" y="631" class="small">
      <tspan x="434" dy="0">Representation: 125/127 tagged</tspan>
    </text>
    <rect x="434" y="654" width="330" height="12" rx="4" fill="#dbeafe"/>
    <rect x="434" y="654" width="325" height="12" rx="4" fill="#2563eb"/>
    <text x="434" y="686" class="small">Union evidence 125/127 · used values 26/26</text>
  </g>
  <g id="field-map-hardware" data-role="presentation-dimension">
    <rect x="796" y="537" width="366" height="185" rx="12" fill="#ffffff" stroke="#60a5fa"/>
    <rect x="796" y="537" width="6" height="185" rx="3" fill="#2563eb"/>
    <text x="814" y="564" class="group-title">
      <tspan x="814" dy="0">Hardware</tspan>
    </text>
    <text x="814" y="587" class="body">
      <tspan x="814" dy="0">On which execution substrate is evidence</tspan>
      <tspan x="814" dy="18">obtained?</tspan>
    </text>
    <text x="814" y="631" class="small">
      <tspan x="814" dy="0">Hardware: 124/127 tagged</tspan>
    </text>
    <rect x="814" y="654" width="330" height="12" rx="4" fill="#dbeafe"/>
    <rect x="814" y="654" width="322" height="12" rx="4" fill="#2563eb"/>
    <text x="814" y="686" class="small">Union evidence 124/127 · used values 17/17</text>
  </g>
  <text x="36" y="740" class="small">
    <tspan x="36" dy="0">This projection partitions every detailed facet family exactly once. Complete controlled values, boundaries, system reverse links, and primary sources: reports/field-map.md.</tspan>
  </text>
</svg>
