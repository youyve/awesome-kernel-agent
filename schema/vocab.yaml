# Each facet answers one stable question. Lists are positive, multi-label
# annotations: an empty list means "not evidenced in the catalog", never a
# verified negative. The groups below drive both the ontology Landscape and
# the complete Field Map; no system or facet is selected by the renderer.
facet_dimensions:
  policy_adaptation:
    label: Policy adaptation
    question: How is the proposal policy conditioned or adapted?
    boundary: Prompting and model adaptation only; candidate enumeration belongs to generation/search.
    group: agent-mechanism
  generation_mode:
    label: Generation mode
    question: Is candidate production direct or revised across iterations?
    boundary: Loop shape only; named search algorithms belong to search strategy.
    group: agent-mechanism
  search_strategy:
    label: Search strategy
    question: How are multiple candidate programs explored or selected?
    boundary: Search/selection algorithms only; direct versus iterative execution is recorded separately.
    group: agent-mechanism
  participants:
    label: Actor composition
    question: Which agent and non-agent actors are explicitly inside the optimization loop?
    boundary: Actor composition only; compiler-in-the-loop requires co-decision or transformation, not ordinary compiler feedback, and coordination topology is recorded separately.
    group: agent-mechanism
  coordination:
    label: Coordination
    question: How are participating actors organized or scheduled?
    boundary: Control topology and role organization, not candidate-search algorithms.
    group: agent-mechanism
  feedback_signal:
    label: Feedback signal
    question: What outcome is observed and returned to the optimizer?
    boundary: Measured outcome only; the instrument or evidence channel is recorded separately.
    group: agent-mechanism
  feedback_source:
    label: Feedback source
    question: Through which instrument or analysis channel is evidence obtained?
    boundary: Compiler, execution-analysis, verification, or analytical channels; not the measured outcome itself.
    group: agent-mechanism
  memory:
    label: State retention
    question: Which state-retention or reuse mechanisms are explicitly used?
    boundary: Runtime decision state, access, or persistence only; published datasets, logs, and output archives are project artifacts unless reused by the agent.
    group: agent-mechanism
  workload_scope:
    label: Workload scope
    question: At what workload granularity is optimization or evaluation demonstrated?
    boundary: Kernel-to-system workload extent; software integration contexts are recorded separately.
    group: optimization-target
  integration_scope:
    label: Integration scope
    question: Which surrounding software or system context is explicitly in scope?
    boundary: Library, compiler, runtime, serving, communication, or distributed integration; not a mere baseline mention.
    group: optimization-target
  optimization_level:
    label: Artifact level
    question: At which program or machine abstraction does the system directly edit or select artifacts?
    boundary: Artifact abstraction only; algorithm and schedule decisions are recorded as optimization focus.
    group: optimization-target
  optimization_focus:
    label: Optimization focus
    question: Does the system explicitly optimize algorithmic structure or schedule/mapping decisions?
    boundary: Decision type only; source language and IR are recorded as artifact level and representation.
    group: optimization-target
  representations:
    label: Representation
    question: Which concrete language, DSL, IR, or ISA represents generated or optimized artifacts?
    boundary: Concrete notation only; hardware target and abstraction level remain separate.
    group: optimization-target
  hardware:
    label: Hardware
    question: On which accelerator or processor family is the system evaluated or targeted?
    boundary: Execution substrate only; software representation is recorded separately.
    group: execution-substrate

facet_groups:
  agent-mechanism:
    label: Agent mechanism
    definition: Fields describing how proposals are produced, coordinated, evaluated, and retained.
    relation: describes the optimization process
  optimization-target:
    label: Optimization target and context
    definition: Fields describing what is changed and the workload or software context in scope.
    relation: acts on or evaluates
  execution-substrate:
    label: Execution substrate
    definition: Fields describing the hardware on which evidence is obtained.
    relation: is evaluated on

# Compact README projection. This partitions every detailed facet exactly once
# without replacing the evidence schema: each item is a presentation union of
# the listed facet families, and the complete value-level reverse index remains
# in reports/field-map.md.
presentation_taxonomy:
  adaptation:
    label: Adaptation
    question: How is the proposal policy adapted?
    facets: [policy_adaptation]
  search:
    label: Search
    question: How are candidates produced, revised, explored, or selected?
    facets: [generation_mode, search_strategy]
  orchestration:
    label: Orchestration
    question: Which actors participate and how are they coordinated?
    facets: [participants, coordination]
  feedback:
    label: Feedback
    question: What outcome is observed, and through which evidence channel?
    facets: [feedback_signal, feedback_source]
  memory:
    label: Memory
    question: Which optimization state is retained or reused?
    facets: [memory]
  scope:
    label: Scope
    question: What workload extent and integration context are in scope?
    facets: [workload_scope, integration_scope]
  optimization-target:
    label: Optimization target
    question: At what artifact level, and over which decision type, does optimization act?
    facets: [optimization_level, optimization_focus]
  representation:
    label: Representation
    question: Which concrete language, DSL, IR, or ISA carries the artifact?
    facets: [representations]
  hardware:
    label: Hardware
    question: On which execution substrate is evidence obtained?
    facets: [hardware]

# Presentation-only Profile compression. Each slot scans configured dimensions
# and controlled-vocabulary values after implied parent values are removed;
# generic fallback values are deferred until no other evidenced candidate is
# available. Suppressions prevent a second label from merely restating the
# first. No inferred tag or editorial importance score participates.
profile_derivation:
  approach_dimensions:
  - policy_adaptation
  - search_strategy
  - generation_mode
  - coordination
  - participants
  grounding_dimensions:
  - feedback_source
  - feedback_signal
  - memory
  fallback_values:
  - prompting
  - direct
  - single-agent
  suppressions:
    compiler-in-the-loop:
    - compiler

facet_constraints:
  mutually_exclusive:
    generation_mode:
    - direct
    - iterative-refinement
    participants:
    - single-agent
    - multi-agent
  implies:
    policy_adaptation:
      agentic-reinforcement-learning:
      - reinforcement-learning
    search_strategy:
      map-elites:
      - quality-diversity
      - evolutionary-search

